# Release: manually triggered. Builds, tests and packs once, publishes those exact
# packages to nuget.org (Trusted Publishing), then creates the vX.Y.Z tag and the
# GitHub Release on the commit that was built. A failed publish leaves no tag.
# NOTE: the nuget.org Trusted Publishing policy binds this file name (release.yml)
# and the environment name (nuget). Renaming either breaks publishing.
name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.4.0 or 1.4.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        env:
          VERSION: ${{ inputs.version }}   # inputs reach the shell only via env
        # One check, so the tag always equals the package version NuGet writes
        # (it would turn 1.2 into 1.2.0). Duplicates are caught by nuget.org itself.
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'$VERSION' is not X.Y.Z or X.Y.Z-suffix"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build, test, pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet restore AnglePlates.slnx
          dotnet build AnglePlates.slnx -c "$CONFIGURATION" --no-restore -warnaserror -p:ContinuousIntegrationBuild=true -p:Version="$VERSION"
          dotnet test --project tests/AnglePlates.Tests -c "$CONFIGURATION" --no-build --results-directory artifacts/TestResults
          dotnet test --project tests/AnglePlates.Runtime.Tests -c "$CONFIGURATION" --no-build --results-directory artifacts/TestResults
          dotnet run --project samples/HelloWorld -c "$CONFIGURATION" --no-build --no-launch-profile
          dotnet pack AnglePlates.slnx --no-build -c "$CONFIGURATION" -o artifacts/package -p:ContinuousIntegrationBuild=true -p:Version="$VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate the installed package and Native AOT
        shell: pwsh
        run: ./scripts/validate-package.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload test results and failed snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            artifacts/TestResults/**
            **/*.received.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/package/*
          if-no-files-found: error

  publish:
    name: Publish, tag and release
    needs: build
    runs-on: ubuntu-latest
    environment: nuget     # add required reviewers; must match the Trusted Publishing policy
    permissions:
      contents: write      # create the tag and GitHub Release
      id-token: write      # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # No --skip-duplicate: an existing version must fail the run before anything is tagged.
        run: |
          dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "v$VERSION" artifacts/* "${args[@]}"
