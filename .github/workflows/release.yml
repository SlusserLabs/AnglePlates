name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      release: true

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-package
          path: package
      - name: Check the release tag
        run: |
          version="$(basename package/*.nupkg .nupkg)"
          tag="v${version#SlusserLabs.AnglePlates.}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object | [.type, .sha] | @tsv' 2>"$error_file")"; then
            read -r type sha <<< "$object"
            while [ "$type" = 'tag' ]; do
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')"
              read -r type sha <<< "$object"
            done
            if [ "$type" != 'commit' ] || [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag points to a different object; bump VersionPrefix first"
              exit 1
            fi
          elif ! grep -q '(HTTP 404)' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Log in to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the validated package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "package/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Tag the published commit and create the GitHub Release
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
