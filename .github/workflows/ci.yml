# CI: build, test and pack on every push and PR. Pushes to this repository (not
# PRs, not forks) also publish a unique prerelease X.Y.Z-ci.<run_number> to
# int.nugettest.org via Trusted Publishing.
# NOTE: the int.nugettest.org Trusted Publishing policy binds this file name
# (ci.yml) and the environment name (int-nugettest).
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']        # release.yml creates tags; don't rebuild them
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  VERSION_SUFFIX: ci.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build, test, pack
        run: |
          dotnet restore AnglePlates.slnx
          dotnet build AnglePlates.slnx -c "$CONFIGURATION" --no-restore -warnaserror -p:ContinuousIntegrationBuild=true -p:VersionSuffix="$VERSION_SUFFIX"
          dotnet test --project tests/AnglePlates.Tests -c "$CONFIGURATION" --no-build --results-directory artifacts/TestResults
          dotnet test --project tests/AnglePlates.Runtime.Tests -c "$CONFIGURATION" --no-build --results-directory artifacts/TestResults
          dotnet run --project samples/HelloWorld -c "$CONFIGURATION" --no-build --no-launch-profile
          dotnet pack AnglePlates.slnx --no-build -c "$CONFIGURATION" -o artifacts/package -p:ContinuousIntegrationBuild=true -p:VersionSuffix="$VERSION_SUFFIX"
          echo "PACKAGE_VERSION=$(dotnet msbuild src/AnglePlates/AnglePlates.csproj -getProperty:Version -p:VersionSuffix="$VERSION_SUFFIX")" >> "$GITHUB_ENV"

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate the installed package and Native AOT
        shell: pwsh
        run: ./scripts/validate-package.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload test results and failed snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            artifacts/TestResults/**
            **/*.received.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/package/*
          if-no-files-found: error

  publish-int:
    name: Publish to int.nugettest.org
    needs: build
    if: github.event_name == 'push' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: int-nugettest   # must match the int.nugettest.org Trusted Publishing policy
    permissions:
      contents: read
      id-token: write            # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: NuGet login (int.nugettest.org)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_INT_USER }}   # int.nugettest.org profile name (separate account)
          # NuGet/login defaults to nuget.org; both overrides are required for int.
          token-service-url: https://int.nugettest.org/api/v2/token
          audience: https://int.nugettest.org

      - name: Push to int.nugettest.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --source https://apiint.nugettest.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
