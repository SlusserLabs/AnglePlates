name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Choose the package version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version="$(dotnet msbuild src/AnglePlates/AnglePlates.csproj -getProperty:VersionPrefix)"
          [ "$RELEASE" = 'true' ] || version="$version-beta.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet restore AnglePlates.slnx
      - run: dotnet build AnglePlates.slnx -c Release --no-restore -warnaserror -p:Version=$PACKAGE_VERSION
      - name: Test the generator
        run: dotnet test --project tests/AnglePlates.Tests -c Release --no-build --results-directory TestResults
      - name: Test rendering
        run: dotnet test --project tests/AnglePlates.Runtime.Tests -c Release --no-build --results-directory TestResults
      - run: dotnet run --project samples/HelloWorld -c Release --no-build --no-launch-profile
      - run: dotnet pack src/AnglePlates/AnglePlates.csproj -c Release --no-build -o artifacts/package -p:Version=$PACKAGE_VERSION
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate the installed package and Native AOT
        shell: pwsh
        run: ./scripts/validate-package.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload test results and failed snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**
            **/*.received.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-package
          path: artifacts/package/*
          if-no-files-found: error

  publish-nugettest:
    # Pushes only: pull requests can't get an OIDC token from forks, and release runs publish to nuget.org instead.
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-package
          path: package
      - name: Log in to NuGet integration feed
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
          token-service-url: https://int.nugettest.org/api/v2/token
          audience: https://int.nugettest.org
      - name: Publish the validated package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "package/*.nupkg" --api-key "$NUGET_API_KEY" --source https://apiint.nugettest.org/v3/index.json
