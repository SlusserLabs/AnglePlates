name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
      integration-test:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Choose the package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          INTEGRATION_TEST: ${{ inputs.integration-test }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            prefix="$(dotnet msbuild src/AnglePlates/AnglePlates.csproj -getProperty:VersionPrefix)"
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_TAG" == "v$prefix" ]] || { echo "Release tag must match v$prefix"; exit 1; }
            version="${RELEASE_TAG#v}"
          elif [ "$INTEGRATION_TEST" = 'true' ]; then
            prefix="$(dotnet msbuild src/AnglePlates/AnglePlates.csproj -getProperty:VersionPrefix)"
            version="$prefix-beta.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          else
            version="0.0.0-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet restore AnglePlates.slnx
      - run: dotnet build AnglePlates.slnx -c Release --no-restore -warnaserror -p:Version=$PACKAGE_VERSION
      - name: Test the generator
        run: dotnet test --project tests/AnglePlates.Tests -c Release --no-build --results-directory TestResults
      - name: Test rendering
        run: dotnet test --project tests/AnglePlates.Runtime.Tests -c Release --no-build --results-directory TestResults
      - run: dotnet run --project samples/HelloWorld -c Release --no-build --no-launch-profile
      - run: dotnet pack src/AnglePlates/AnglePlates.csproj -c Release --no-build -o artifacts/package -p:Version=$PACKAGE_VERSION
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Validate the installed package and Native AOT
        shell: pwsh
        run: ./scripts/validate-package.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload test results and failed snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**
            **/*.received.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-package
          path: artifacts/package/*
          if-no-files-found: error
