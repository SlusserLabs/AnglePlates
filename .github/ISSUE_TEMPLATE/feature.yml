name: Feature request
description: Something AnglePlates doesn't do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AnglePlates won't add T4 syntax, `.tt` files, runtime template compilation, or a runtime package.
        Everything else is fair game.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The template or app you're writing, and where AnglePlates gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The syntax, API, or MSBuild setting you have in mind. A short template or code sample is great.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Any workaround you're using, such as a partial class or a child template.
