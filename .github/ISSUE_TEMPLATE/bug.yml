name: Bug report
description: A template that generates the wrong code, a confusing diagnostic, or a build that breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The smallest template and model that still show the problem help the most.
        For a security problem, don't open an issue; see SECURITY.md instead.
  - type: textarea
    id: template
    attributes:
      label: Template
      description: The template file, including its directives. Trim it down as far as you can.
      render: html
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model
      description: The C# type the template's `#model` names, and the value you rendered it with.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: The output, exception, or build error you got, and what you expected instead.
    validations:
      required: true
  - type: input
    id: diagnostics
    attributes:
      label: Diagnostic IDs
      description: Any SLAP or CS IDs in the build output, such as SLAP004 or CS0103.
      placeholder: SLAP004, CS0103
  - type: input
    id: package-version
    attributes:
      label: AnglePlates version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK
      description: The output of `dotnet --version` in the project's folder.
      placeholder: 10.0.100
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Anything else
      description: Relevant project settings, such as `LangVersion`, `AnglePlateBaseAccessModifier`, `AnglePlate` items, or Native AOT.
