# Weekly update pull requests for the solution's NuGet packages and the workflow actions.
version: 2
updates:
  - package-ecosystem: nuget
    # The projects in AnglePlates.slnx. The package consumers are left out, because they reference the freshly packed AnglePlates.
    directories:
      - /src/AnglePlates
      - /tests/AnglePlates.Tests
      - /tests/AnglePlates.Runtime.Tests
      - /benchmarks/AnglePlates.Benchmarks
    schedule:
      interval: weekly
    groups:
      # TUnit and Verify release together often, and Verify.TUnit tracks TUnit, so they update in one pull request
      tunit-and-verify:
        patterns:
          - TUnit*
          - Verify*
    ignore:
      # The generator builds against Roslyn 4.14 on purpose, so it loads in every .NET 10 SDK's compiler. A newer Roslyn
      # can stop the analyzer from loading in older SDKs, so raising that floor is a deliberate, tested change.
      - dependency-name: Microsoft.CodeAnalysis*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
